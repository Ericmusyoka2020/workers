<body>

<div class="box">

    <div id="regSection">

        <h2>Stackcrafts Studio</h2>
        <p class="info">Marketers Portal - Create Account</p>

        <!-- Name -->
        <input
            id="rName"
            placeholder="Full Name"
            type="text"
            autocomplete="name"
        >

        <!-- Phone -->
        <input
            id="rPhone"
            placeholder="Phone Number"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
        >

        <!-- User-created account number -->
        <input
            id="rAccount"
            placeholder="Create Account Number"
            type="text"
            maxlength="20"
            autocomplete="username"
        >

        <p class="hint">
            Create your own account number. This will be used to log in.
        </p>

        <!-- Password -->
        <input
            id="rPass"
            type="password"
            placeholder="Set PIN / Password"
            autocomplete="new-password"
        >

        <!-- Referral -->
        <select id="referralChoice" onchange="toggleReferralInput()">
            <option value="no">No Referral</option>
            <option value="yes">Has been Referred</option>
        </select>

        <input
            id="rReferrer"
            placeholder="Referrer's Phone Number"
            type="tel"
            inputmode="numeric"
            style="display:none;"
        >

        <button id="rBtn" onclick="register()">
            Register Account
        </button>

        <button
            class="btn-secondary"
            onclick="window.location.href='index.html'"
        >
            🔑 Change / Reset PIN
        </button>

        <p
            class="link"
            onclick="window.location.href='index.html'"
        >
            ← Back to Login
        </p>

        <p id="status"></p>

    </div>

</div>

<script>

const API = "https://funds-5bhq.onrender.com/api";

/* Service Worker */
async function initServiceWorker() {

    if ('serviceWorker' in navigator) {

        try {

            const reg =
                await navigator.serviceWorker.register('/sw.js');

            console.log('Service Worker registered');

            if (navigator.serviceWorker.controller) {

                navigator.serviceWorker.controller.postMessage({
                    action: 'start'
                });

            }

            return reg;

        } catch (err) {

            console.log(
                'Service Worker registration failed:',
                err
            );

        }
    }
}

/* Start service worker */
window.addEventListener('load', () => {
    initServiceWorker();
});


/* Referral field */
function toggleReferralInput() {

    const choice =
        document.getElementById('referralChoice').value;

    document.getElementById('rReferrer').style.display =
        choice === 'yes' ? 'block' : 'none';
}


/* Register account */
async function register() {

    const btn =
        document.getElementById('rBtn');

    const status =
        document.getElementById('status');

    const name =
        document.getElementById('rName').value.trim();

    const phone =
        document.getElementById('rPhone').value.trim();

    const accountNumber =
        document.getElementById('rAccount').value.trim();

    const pass =
        document.getElementById('rPass').value.trim();

    const refChoice =
        document.getElementById('referralChoice').value;

    const refNumber =
        document.getElementById('rReferrer').value.trim();


    /* Validation */

    if (!name || !phone || !accountNumber || !pass) {

        status.className = "error";

        status.innerText =
            "Please fill in all required fields.";

        return;
    }


    /* Phone validation */

    if (!/^[0-9]{10}$/.test(phone)) {

        status.className = "error";

        status.innerText =
            "Enter a valid 10-digit phone number.";

        return;
    }


    /* Account number validation */

    if (accountNumber.length < 3) {

        status.className = "error";

        status.innerText =
            "Account number must contain at least 3 characters.";

        return;
    }


    /* Account number must be different from phone */

    if (accountNumber === phone) {

        status.className = "error";

        status.innerText =
            "Account number cannot be the same as your phone number.";

        return;
    }


    btn.innerText = "Creating Account...";
    btn.disabled = true;

    status.className = "";
    status.innerText = "";


    await initServiceWorker();


    try {

        /*
         * The backend should save:
         *
         * name
         * phone
         * accountNumber
         * password
         *
         * Example:
         *
         * James
         * 0710911645
         * JAMES2026
         * ********
         */

        const res = await fetch(`${API}/register`, {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({

                name: name,

                phone: phone,

                accountNumber: accountNumber,

                password: pass,

                referral:
                    refChoice === 'yes'
                        ? refNumber
                        : null

            })

        });


        let data = {};

        try {

            data = await res.json();

        } catch (e) {

            console.warn(
                "Response was not JSON:",
                e
            );

        }


        if (res.ok && (data.success !== false)) {

            status.className = "success";

            status.innerHTML = `
                <strong>✅ Account Created Successfully!</strong><br><br>
                Name: ${escapeHtml(name)}<br>
                Phone: ${escapeHtml(phone)}<br>
                Account Number: ${escapeHtml(accountNumber)}
            `;


            /*
             * Redirect to login after successful registration.
             * The user logs in using the account number they created,
             * NOT their phone number.
             */

            setTimeout(() => {

                window.location.href = "index.html";

            }, 2500);


        } else {

            status.className = "error";

            status.innerText =
                data.error ||
                data.message ||
                "Registration failed. Please check your details.";

            btn.disabled = false;

            btn.innerText = "Register Account";

        }


    } catch (err) {

        console.error(
            "Registration error:",
            err
        );

        status.className = "error";

        status.innerText =
            "Connection error. Please try again.";

        btn.disabled = false;

        btn.innerText = "Register Account";

    }

}


/* Prevent HTML injection in displayed account details */
function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
